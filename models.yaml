# Model directory: human names for checkpoint identities.
#
# Every Skald record is keyed by a SHA-256 (weighed-in checkpoints) or an
# endpoint-identity hash (served models). This file maps known identities to
# the names humans use, so surfaces can render "Qwen3.8-Flash-Next
# (abliterated)" instead of "cbe78dd270cd…". Unknown hashes render as their
# 12-char prefix plus "(unnamed)" — never silently, and anyone can add an
# entry via pull request.
#
# Fields per entry:
#   sha256:      the full model_checkpoint_sha256 as stored in records
#   name:        short human name, shown in tables and dropdowns
#   description: one line on what this is (variant, provenance, caveats)
#   kind:        weights | endpoint   (endpoint = UNVERIFIED served-model
#                identity, not a weight hash — see the openai_compat adapter)

